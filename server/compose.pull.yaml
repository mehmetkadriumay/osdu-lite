services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    mem_limit: 2g
    ports:
      - "${AZURITE_BIND_IP:-127.0.0.1}:${AZURITE_BLOB_PORT:-10000}:10000"
    command: azurite-blob --blobHost 0.0.0.0 --location /data --disableProductStyleUrl --disableTelemetry
    volumes:
      - azurite-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('net').connect(10000,'127.0.0.1');s.on('connect',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [backend]
  opensearch:
    image: opensearchproject/opensearch:3.9.0
    mem_limit: 6g
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    environment:
      discovery.type: single-node
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "${OPENSEARCH_JAVA_OPTS:--Xms2g -Xmx2g}"
      node.store.allow_mmap: "false"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [backend]
  server:
    # Published latest does NOT represent this uncommitted core implementation.
    image: "${IMAGE:-ghcr.io/mehmetkadriumay/osdu-lite:latest}"
    mem_limit: 2g
    container_name: osdu-well360-local
    ports:
      - "8089:8089"
    environment:
      PORT: "8089"
      OSDU_PARTITION: "company-prod"
      OSDU_COMPAT_PROFILE: "${OSDU_COMPAT_PROFILE:-legacy}"
      AZURE_STORAGE_PUBLIC_BLOB_ENDPOINT: "${AZURE_STORAGE_PUBLIC_BLOB_ENDPOINT:-http://localhost:10000/devstoreaccount1}"
      OSDU_TOKEN: "demo-token"
      REQUIRE_AUTH: "true"
      PRELOAD_FULL_SAMPLE: "true"
      INDEX_DELAY_SECONDS: "0.7"
      OPENSEARCH_URL: "http://opensearch:9200"
      # Public Azurite development key, not a production credential.
      AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
    depends_on:
      azurite:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    networks: [backend, frontend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8089/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
networks:
  backend:
    internal: true
  frontend: {}
volumes:
  azurite-data: {}
  opensearch-data: {}